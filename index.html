<script>
const questions = [
  {
    n: 1, ch: "10", topic: "Add the bystander",
    q: "A factory’s own cost of one more unit is $11. Neighbors suffer $2.50 of extra damage from that unit. Marginal social cost is:",
    choices: ["$8.50", "$11.00", "$13.50", "$2.50"],
    a: 2,
    ask: "It wants the cost to everyone, not just the factory.",
    why: [
      "$8.50 subtracts the damage. The neighbor’s harm makes the true cost bigger, not smaller.",
      "$11 is only what the factory pays. The neighbor is left out, so this is too small.",
      "Add them. The factory pays $11. The neighbor is hurt by $2.50. Together that is $13.50. Social cost means both people.",
      "$2.50 is only the neighbor. A unit still costs the factory $11 to make. Leaving that out is too small."
    ]
  },
  {
    n: 2, ch: "10", topic: "Negative externality",
    q: "A plant dumps smoke on people who do not buy the product. Which description is right?",
    choices: [
      "The social-benefit line sits above demand, and the market makes too little",
      "The social-cost line sits above supply, and the market makes too much",
      "Supply sits above the social-cost line, and the market makes too little",
      "Demand sits above the social-benefit line, and the market makes too much"
    ],
    a: 1,
    ask: "Someone outside the deal is being hurt. What does the market do?",
    why: [
      "That is a helpful side effect, like a flu shot. Smoke is a harmful side effect.",
      "The factory ignores the neighbor, so its cost line is too low. The true cost line sits above it. The market crosses too far to the right. It makes too much.",
      "The true cost is higher than the factory’s cost, not lower. And the market makes too much, not too little.",
      "Smoke is about cost, not about buyers getting an extra benefit. The market’s mistake is too much output."
    ]
  },
  {
    n: 3, ch: "10", topic: "Positive externality",
    q: "A flu shot protects the person who gets it and also the people around them. The best quantity is where:",
    choices: [
      "Ordinary demand crosses supply",
      "The marginal-social-benefit line crosses supply",
      "The social-cost line crosses demand to the left of the market",
      "Marginal revenue crosses marginal cost"
    ],
    a: 1,
    ask: "The shot helps people who never paid for it. Where should we stop?",
    why: [
      "That crossing counts only the person getting the shot. It ignores the people who don’t get sick because of it. The market stops there, and that is too few shots.",
      "Draw a benefit line above demand, because total benefit is the patient’s benefit plus everyone else’s. The best point is that higher line crossing the cost line. That point is farther right. The fix is a subsidy, which pushes the quantity up. A tax would push it the wrong way.",
      "A social-cost line to the left is the pollution picture. Shots are the opposite problem: too little, not too much.",
      "Marginal revenue and marginal cost are how a firm with market power picks its own quantity. This question is about society, not one firm’s profit."
    ]
  },
  {
    n: 4, ch: "10", topic: "A tax that is too small",
    q: "At the best quantity, one more unit of pollution does $30 of damage. The tax is $10 per unit. The market will:",
    choices: [
      "Pollute exactly the right amount",
      "Pollute less than the right amount",
      "Still pollute more than the right amount",
      "Turn the activity into a positive externality"
    ],
    a: 2,
    ask: "Is $10 enough to make the firm feel the full $30 of harm?",
    why: [
      "The right tax equals the damage at the best quantity. $10 is not $30, so the firm still ignores most of the harm.",
      "Too little pollution would happen if the tax were bigger than the damage. $10 is smaller than $30, so the firm is not scared off enough.",
      "The firm only pays $10 of a $30 problem. It still treats pollution as cheaper than it really is, so it pollutes more than the best amount.",
      "A tax does not make smoke helpful to the neighbors. The side effect is still a cost. It is just not fully priced in."
    ]
  },
  {
    n: 5, ch: "10", topic: "Which line is social cost",
    q: "On a graph, at a particular quantity, marginal social cost is:",
    choices: [
      "The height of the ordinary supply line",
      "The height of the marginal-social-cost line",
      "The gap between price and marginal revenue",
      "Price times quantity"
    ],
    a: 1,
    ask: "Which line already includes the neighbor?",
    why: [
      "Ordinary supply is only the factory’s cost. If you read the height there, you forget the bystander.",
      "The social-cost line was drawn by adding the neighbor’s damage on top of the factory’s cost. Its height at that quantity is the full cost. Use that line.",
      "The gap between price and marginal revenue is a monopoly idea. It is not the neighbor’s damage.",
      "Price times quantity is total revenue, a dollar total, not the cost of one more unit."
    ]
  },
  {
    n: 6, ch: "10", topic: "Private good",
    q: "A propane refill is a private good because it is:",
    choices: [
      "Nonrival and nonexcludable",
      "Nonrival and excludable",
      "Rival and nonexcludable",
      "Rival and excludable"
    ],
    a: 3,
    ask: "Two checks: does your use leave less for someone else, and can the seller say no?",
    why: [
      "That is a public good, like a free broadcast. A refill gets used up, and the seller can refuse to sell it.",
      "Nonrival means your use does not use it up. A refill is gone once you burn it. Excludable is only half of the answer.",
      "Rival is right, but the seller can keep you from getting it if you do not pay. Open-ocean fish are the thing you cannot keep people off.",
      "You use the tank, so someone else cannot use those same gallons. That is rival. The store can refuse to fill it. That is excludable. Both together means a private good, like a sandwich."
    ]
  },
  {
    n: 7, ch: "10", topic: "Club good",
    q: "A paid streaming service can block people who do not pay. One extra viewer barely changes anyone else’s viewing. It is a:",
    choices: ["Private good", "Common resource", "Club good", "Public good"],
    a: 2,
    ask: "Can they lock you out? Does one more viewer use it up?",
    why: [
      "A private good gets used up. One more person watching does not empty the show for everyone else.",
      "A common resource gets used up and is hard to fence off, like fish. Streaming is the opposite on both counts.",
      "They can keep non-payers out, so it is excludable. One more viewer does not spoil it for others, so it is nonrival. Excludable plus nonrival is a club good.",
      "A public good is one you cannot easily keep people out of. This service can block non-payers, so it is not public."
    ]
  },
  {
    n: 8, ch: "10", topic: "Common resource",
    q: "Fish in the open ocean, which anyone can take, are a:",
    choices: ["Club good", "Public good", "Common resource", "Private good"],
    a: 2,
    ask: "A fish that is caught is gone. Can anyone stop the next boat?",
    why: [
      "A club good can keep non-payers out. Nobody owns the open ocean in this story.",
      "A public good is not used up when one more person enjoys it. A caught fish is gone. That is the difference.",
      "Rival, because that fish cannot be caught twice. Nonexcludable, because it is hard to keep other boats away. Those two facts together are a common resource. People tend to take too many.",
      "A private good can be kept from non-payers. Open water fails that test."
    ]
  },
  {
    n: 9, ch: "10", topic: "Public good",
    q: "A free over-the-air broadcast: one more viewer does not stop anyone else from watching, and the station cannot easily charge each viewer. This is a:",
    choices: ["Private good", "Common resource", "Club good", "Public good"],
    a: 3,
    ask: "Does one more viewer use it up, and can the station lock people out?",
    why: [
      "Private goods are used up and can be sold one by one. A broadcast is neither.",
      "A common resource is used up. The broadcast is still there no matter how many TVs are on.",
      "A club good can block non-payers. This station cannot easily charge each viewer.",
      "Not used up, and not fenced off. That is a public good, like national defense. The trouble is free riders: people who watch and never pay, because nobody can make them."
    ]
  },
  {
    n: 10, ch: "10", topic: "Free rider",
    q: "Someone watches a paid service with a password they did not pay for. That person is:",
    choices: ["Colluding", "Free riding", "Earning a compensating differential", "Receiving an efficiency wage"],
    a: 1,
    ask: "They get the show. They do not pay. What is that called?",
    why: [
      "Collusion is rivals agreeing to raise a price or cut output. One person borrowing a password is not a pact between firms.",
      "A free rider takes the benefit and skips the bill. Password sharing is the class example. Making the login harder to share makes the service more excludable, which cuts free riding.",
      "A compensating differential is extra pay for a worse job. Nobody is being paid in this story.",
      "An efficiency wage is a firm paying workers more than other jobs so they try harder. This is a viewer, not a paycheck."
    ]
  },
  {
    n: 11, ch: "10", topic: "Fewer permits",
    q: "A cap-and-trade program cuts the number of pollution permits. Then:",
    choices: [
      "Permit prices fall and pollution rises",
      "Permit prices rise and pollution falls",
      "Prices and pollution both stay the same",
      "Permit prices rise and pollution rises"
    ],
    a: 1,
    ask: "Permits just got scarcer. What happens to their price, and to smoke?",
    why: [
      "Fewer permits means they are harder to get, so the price goes up, not down. And the cap is what limits smoke, so pollution cannot rise.",
      "Scarcer permits cost more. The whole point of handing out fewer of them is that total allowed pollution falls.",
      "The number of permits is the cap. Changing that number changes both the price and the amount of pollution.",
      "The price of a permit does rise, but pollution does not rise with it. Less permission to pollute means less pollution."
    ]
  },
  {
    n: 12, ch: "12", topic: "Worse job, higher pay",
    q: "Same skills. The noisy night job pays more than the quiet day job. The gap is mostly:",
    choices: ["Discrimination", "A compensating differential", "An efficiency wage", "Human capital"],
    a: 1,
    ask: "The jobs are not the same. The night job is worse. Why the extra pay?",
    why: [
      "Discrimination, on this exam, means the job, the hours, and the skills match, and the only difference is the group the person belongs to. Here the jobs themselves differ.",
      "The extra pay is there to make up for the worse conditions: noise and nights. That offset is a compensating differential. A nicer job can pay less for the same reason, in reverse.",
      "An efficiency wage is pay above what other employers offer, used so people stay and work harder. This gap is about the job being unpleasant, not about a firm trying to buy extra effort.",
      "Human capital is school, training, and experience. The question says skills are the same, so that is not the gap."
    ]
  },
  {
    n: 13, ch: "12", topic: "Human capital",
    q: "Job knowledge gained from school or from years of practice is:",
    choices: ["A network effect", "Human capital", "Collusion", "An implicit cost"],
    a: 1,
    ask: "What do you call skills that were learned?",
    why: [
      "A network effect is a product that gets more useful as more people join it. It is not a person’s training.",
      "Human capital is education, training, experience, and skills. More of it can make a worker more productive and can raise the wage.",
      "Collusion is an agreement among sellers. School is not an agreement to fix a price.",
      "An implicit cost is what a business owner gave up, like a salary they did not take. Knowledge in the worker’s head is not that."
    ]
  },
  {
    n: 14, ch: "12", topic: "Efficiency wage",
    q: "A firm pays more than workers could earn at other jobs, so they stay and work harder. That is:",
    choices: ["A compensating differential", "An efficiency wage", "Accounting profit", "A price effect"],
    a: 1,
    ask: "The pay is high on purpose, to change how people behave.",
    why: [
      "A compensating differential makes up for a worse job. This story never says the job is worse. It says the firm wants more effort and less quitting.",
      "Pay above the other options, used to raise effort, morale, or retention, is an efficiency wage. The wage bill is higher, and it can still raise profit if people waste less and quit less.",
      "Accounting profit is revenue minus cash costs. It is not a kind of wage.",
      "The price effect is the revenue a firm loses when it cuts the price to sell one more unit. It is not a paycheck."
    ]
  },
  {
    n: 15, ch: "12", topic: "Piece rate",
    q: "Which pay most strongly rewards a faster, more accurate worker?",
    choices: ["A benefit unrelated to effort", "Piece-rate pay", "A fixed salary with no bonus", "Reimbursed parking"],
    a: 1,
    ask: "Which paycheck actually changes when the person produces more?",
    why: [
      "If the benefit does not depend on effort, a faster worker gets the same thing as a slower one. There is no extra reward.",
      "Piece rate pays per unit finished. Faster and more accurate means a bigger check. That is incentive pay.",
      "A fixed salary stays the same if you speed up. It does not single out the better worker.",
      "Parking is paid back whether you work fast or not. It does not depend on results."
    ]
  },
  {
    n: 16, ch: "12", topic: "Stock for a manager",
    q: "Giving a manager stock in the company is meant to:",
    choices: [
      "Create a compensating differential for night work",
      "Make the manager gain when the firm’s profit rises",
      "Shift labor supply to the left",
      "Force price equal to marginal cost"
    ],
    a: 1,
    ask: "Why hand the manager a piece of the company?",
    why: [
      "Nothing in the story says the shift is at night. Stock is not hazard pay.",
      "The stock is worth more when the firm does better. The manager’s own money now moves with profit. That is incentive pay.",
      "Labor supply is about how many people are willing to work. One manager’s stock grant does not pull the whole supply curve left.",
      "Price equal to marginal cost is what competition does. A stock grant does not set the product’s price."
    ]
  },
  {
    n: 17, ch: "12", topic: "Discrimination",
    q: "Two people have the same job, the same hours, the same education, and the same experience. One is paid less only because of gender. That is:",
    choices: ["A compensating differential", "Human capital", "Wage discrimination", "A natural monopoly"],
    a: 2,
    ask: "The jobs match. The skills match. The pay does not. Why?",
    why: [
      "A compensating differential needs a real difference in the job, like danger or nights. Here the job is the same.",
      "Human capital would be a difference in school or experience. The question says those match.",
      "Same work, same relevant skills, lower pay only because of the group the person belongs to. That is wage discrimination on this exam.",
      "A natural monopoly is one firm that can serve a whole market at a lower cost than several firms. It is not a pay gap between two workers."
    ]
  },
  {
    n: 18, ch: "12", topic: "License removed",
    q: "The state drops a license requirement for an occupation. In that labor market:",
    choices: [
      "Labor supply shifts left, the wage rises, and employment falls",
      "Labor supply shifts right, the wage falls, and employment rises",
      "Labor demand shifts left and the wage rises",
      "The wage stays the same because of the price effect"
    ],
    a: 1,
    ask: "More people are now allowed to do the job. Which line moves?",
    why: [
      "That is what happens if you add a license and block people. Removing the rule does the opposite.",
      "People who were kept out can now enter. Supply of workers slides right. The new crossing has a lower wage and more people working.",
      "Demand is the employers’ side. The license was a rule about who may work, so it is supply, not demand. And the wage does not rise.",
      "The price effect is about a firm cutting its product price to sell one more unit. It does not freeze a wage when a license disappears."
    ]
  },
  {
    n: 19, ch: "12", topic: "Minimum wage",
    q: "A minimum wage is set above the wage where labor supply crosses labor demand. Then:",
    choices: [
      "Everyone who wants the job at that wage gets one",
      "More people want the job than there are jobs",
      "Firms want more workers than are willing to work",
      "The wage falls until the two lines cross again"
    ],
    a: 1,
    ask: "The wage is stuck above the crossing. Who is left over?",
    why: [
      "At a wage above the crossing, firms do not want that many workers. Some people who want the job do not get it.",
      "A higher wage makes more people willing to work and makes firms want fewer workers. Quantity supplied is bigger than quantity demanded. The gap is unemployment: people who want the job minus jobs available.",
      "That would be a shortage of workers, which happens when the wage is stuck below the crossing. This wage is stuck above it.",
      "A binding minimum wage does not get to fall back to the crossing. The law holds it up."
    ]
  },
  {
    n: 20, ch: "12", topic: "Nicer job, lower pay",
    q: "Two jobs need the same skills. One has a safer schedule and pays less. The pay gap is best read as:",
    choices: [
      "Discrimination, because the pay is unequal",
      "A compensating differential",
      "Proof that human capital does not matter",
      "An oligopoly"
    ],
    a: 1,
    ask: "Pay is lower, but the job is better. Is that the same idea as night-shift pay?",
    why: [
      "Unequal pay is not automatically discrimination. Discrimination needs the jobs and the relevant skills to match, with group membership as the reason. Here the jobs differ.",
      "Part of the “pay” is the safer schedule. People give up some money to get it. Extra pay for a worse job and lower pay for a better job are the same idea: a compensating differential.",
      "The question says skills match, so human capital is not what differs. It still matters in other comparisons.",
      "Oligopoly is a few big sellers of a product. It is not a wage gap between two jobs."
    ]
  },
  {
    n: 21, ch: "14", topic: "Oligopoly",
    q: "A few major sellers, and each one has to guess how the others will react. That market is:",
    choices: ["Perfect competition", "Monopolistic competition", "An oligopoly", "A common resource"],
    a: 2,
    ask: "Count the sellers, and notice that they watch each other.",
    why: [
      "Perfect competition has many sellers of the same product. None of them has to guess a rival’s move, because none of them can move the price.",
      "Monopolistic competition also has many sellers. Their products differ, but there are not just a few of them.",
      "A small number of sellers who depend on each other’s choices is an oligopoly. The “guess how they will react” line is the giveaway.",
      "A common resource is a good like open-ocean fish. It is not a type of seller market."
    ]
  },
  {
    n: 22, ch: "14", topic: "No market power",
    q: "Many sellers of an identical product have:",
    choices: ["A lot of market power", "Essentially no market power", "A natural monopoly", "Customer lock-in"],
    a: 1,
    ask: "Can any one of those sellers choose a higher price and keep the customers?",
    why: [
      "Market power means you can push the price. If the product is identical and there are many sellers, buyers just leave for the next one.",
      "That is perfect competition. Each seller takes the market price. More different products, or fewer sellers, would mean more power.",
      "A natural monopoly is one firm that can serve the whole market cheaper than several firms. This story has many sellers.",
      "Customer lock-in means people are stuck, for example by a cancellation fee. Identical products and many sellers is the opposite: leaving is easy."
    ]
  },
  {
    n: 23, ch: "14", topic: "Natural monopoly",
    q: "One firm can serve the whole market at a lower average cost than several firms could. That is:",
    choices: ["Perfect competition", "A natural monopoly", "Free riding", "An efficiency wage"],
    a: 1,
    ask: "The clue is cost, not “there happens to be one store.”",
    why: [
      "Perfect competition is many firms and no price power. One firm serving everyone cheaper is the opposite structure.",
      "Natural monopoly means splitting the market among several firms would raise average cost. One firm is cheaper for the whole market. A patent is different: a patent is a legal block that can reward an invention. It is not this cost story.",
      "Free riding is taking a benefit without paying. It is not a cost advantage of one firm.",
      "An efficiency wage is a high paycheck used to get more effort. It is not a market with one seller."
    ]
  },
  {
    n: 24, ch: "14", topic: "Marginal revenue is not the price",
    q: "Total revenue is $120 at 2 units and $150 at 3 units. The third unit’s price is $50. Marginal revenue of the third unit is:",
    choices: ["$50", "$30", "$150", "$17"],
    a: 1,
    ask: "How much did total money change when the third unit was sold?",
    why: [
      "$50 is the price of the third unit. To sell that unit the firm cut the price, including on the first two. It does not get to keep the whole $50 as extra revenue.",
      "Marginal revenue is the change in total revenue. $150 minus $120 is $30. The missing $20 is the price effect: money lost because the earlier units now sell for less.",
      "$150 is total revenue at 3 units, not the extra from the last unit.",
      "$17 is not a change you can get from these numbers. Do not divide 50 by 3. Subtract the old total from the new total."
    ]
  },
  {
    n: 25, ch: "14", topic: "Quantity, then price",
    q: "Marginal cost is $30 for every unit. Marginal revenue is $70, then $50, then $30, then $10. Buyers will pay $50 for 3 units. The firm should:",
    choices: [
      "Make 4 units and charge $30",
      "Make 3 units and charge $50",
      "Make units until the price is $30, then charge $50",
      "Make fewer than 3 units in order to raise profit"
    ],
    a: 1,
    ask: "Two steps. Do not read the price off the marginal-revenue number.",
    why: [
      "The fourth unit’s marginal revenue is $10, which is below the $30 cost. That unit lowers profit. And $30 is the cost, not the price buyers pay.",
      "Step 1: make the unit where marginal revenue equals marginal cost. That is the third unit, $30 = $30. Stop before the fourth. Step 2: the demand line says 3 units sell for $50. Charge $50.",
      "A firm with market power does not keep producing until price equals marginal cost. That is what competition does, and it is a larger quantity. This firm stops at marginal revenue equals marginal cost, then reads the price on demand.",
      "The firm is already at the profit-maximizing quantity at 3. Making fewer moves away from that spot, so profit falls. The price buyers pay would rise, but that is not the same as profit rising."
    ]
  },
  {
    n: 26, ch: "14", topic: "Output effect minus price effect",
    q: "For a firm that can set its price, marginal revenue equals:",
    choices: [
      "The output effect plus the price effect",
      "The output effect minus the price effect",
      "Average cost",
      "The neighbor’s damage"

const letters = ["A", "B", "C", "D"];

function explanation(q) {
  const box = document.createElement("div");
  const ask = document.createElement("p");
  ask.className = "ask";
  ask.innerHTML = "<strong>What it is asking. </strong>";
  ask.appendChild(document.createTextNode(q.ask));
  box.appendChild(ask);
  const right = document.createElement("p");
  right.className = "right";
  right.innerHTML = "<strong>Why " + letters[q.a] + " is right. </strong>";
  right.appendChild(document.createTextNode(q.why[q.a]));
  box.appendChild(right);
  q.choices.forEach((_, i) => {
    if (i === q.a) return;
    const p = document.createElement("p");
    p.className = "wrong";
    p.innerHTML = "<strong>" + letters[i] + " is wrong. </strong>";
    p.appendChild(document.createTextNode(q.why[i]));
    box.appendChild(p);
  });
  return box;
}

  const picked = picks[q.n];
  const box = document.getElementById("qcard");
  box.innerHTML = "";
  const card = document.createElement("article");
  card.className = "q";
  const k = document.createElement("p");
  k.className = "kicker";
  k.textContent = "Question " + q.n + " of 40 · Chapter " + q.ch + " · " + q.topic;
  card.appendChild(k);
  const h = document.createElement("h3");
  h.textContent = q.q;
  card.appendChild(h);
  q.choices.forEach((choice, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.textContent = letters[i] + ".  " + choice;
    if (picked !== undefined) {
      if (i === q.a) b.classList.add("right");
      if (i === picked && i !== q.a) b.classList.add("wrong");
      b.disabled = true;
    }
    b.addEventListener("click", () => {
      if (picks[q.n] !== undefined) return;
      picks[q.n] = i;
      renderQuiz();
    });
    card.appendChild(b);
  });
  if (picked === undefined) {
    const hint = document.createElement("p");
    hint.className = "cap";
    hint.textContent = "Pick an answer first. The explanation shows up after you choose.";
    card.appendChild(hint);
  } else {
    card.appendChild(explanation(q));
    const next = document.createElement("button");
    next.type = "button";
    next.className = "choice";
    next.textContent = quizIndex < questions.length - 1 ? "Next question" : "That was the last one";
    next.addEventListener("click", () => {
      if (quizIndex < questions.length - 1) {
        quizIndex += 1;
        renderQuiz();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
    card.appendChild(next);
  }
  box.appendChild(card);
  const answered = questions.filter((item) => picks[item.n] !== undefined);
  const correct = answered.filter((item) => picks[item.n] === item.a).length;
  document.getElementById("quiz-score").textContent = picked === undefined
    ? "Question " + q.n + " of 40. Answer it, then the reason is explained."
    : correct + " right out of " + answered.length + " answered.";
  [...quizJump.children].forEach((btn, i) => {
    const item = questions[i];
    btn.style.background = picks[item.n] === undefined ? "#fff" : picks[item.n] === item.a ? "#e7f3ec" : "#f8ebe8";
    btn.style.outline = i === quizIndex ? "2px solid #111" : "none";
  });
}

function show(name) {
  ["graphs", "all", "quiz"].forEach((id) => {
    document.getElementById(id).classList.toggle("on", id === name);
    document.getElementById("tab-" + id).classList.toggle("on", id === name);
  });
  if (name === "quiz") renderQuiz();
}
document.getElementById("tab-graphs").addEventListener("click", () => show("graphs"));
document.getElementById("tab-all").addEventListener("click", () => show("all"));
document.getElementById("tab-quiz").addEventListener("click", () => show("quiz"));
renderQuiz();
</script>
</body>
</html>
